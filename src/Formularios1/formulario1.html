<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Inscripción al taller de PHP</title>
    </head>
    <body>
    <h1>Inscripción al taller de PHP</h1>
    </body>
    <!--
    for: Conecta un "label" con un input relacionandose con name
    id: Identificador único, sirve para CSS y JS
    name: define el nombre que tendrá el dato cuano se envíe al servidor-->
    <form action="procesar.php" method="post">
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
            maxlength="60" required>
            <!--Type define el tipo de input que se va a introducir
            required sirve para especificar que un campo es obligatorio de usar.
            maxlength sirve para delimitar los caracteres que podemos introducir-->
        </p>
        <p>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
        </p>
        <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad"
            min="16" max="120" required>
        </p>
        <button type="submit">Inscribirme</button>
        
    </form>
    </body>
</html>
