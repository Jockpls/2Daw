<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidinchis</title>
    <style>
        table{border:1px solid black;}
        td{border:1px solid black;}
    </style>
</head>
<body>
    <form action="pedido.php" method="post">
        <p>
            <label for="nombre">Nombre</label>
            <input type="text" minlength="3" maxlength="12" id="nombre" name="nombre" required>
        </p>
        <p>
          <table>
              <thead>
                <th>Producto</th>
                <th>Precio</th>
            </thead>
            <tr>
                <td>Tortilla</td>
                <td>3,50€</td>
            </tr>
            <tr>
                <td>Pollo</td>
                <td>4,50€</td>
            </tr>
            <tr>
                <td>Vegetal</td>
                <td>4,00€</td>
            </tr>
            <tr>
                <td>Queso</td>
                <td>0,50€</td>
            </tr>
            <tr>
                <td>Tomate</td>
                <td>0.30€</td>
            </tr>
            <tr>
                <td>Salsa</td>
                <td>0.20€</td>
            </tr>
          </table>
        </p>
        <a>
            <label for="bocadillo">Bocadillos</label>
            <select id="bocadillo">
                <option value="Tortilla">Tortilla</option>
                <option value="Pollo">Pollo</option>
                <option value="Vegetal">Vegetal de callos</option>
                <option value="Queso(Extra)">Queso(Extra)</option>
                <option value="Tomate(Extra)">Tomate(Extra)</option>
                <option value="Salsa(Extra)">Salsa(Extra)</option>
            </select>
        </a>
        <a>
            <label for="Cantidad">Cantidad</label>
            <input type="number" min="0" max="10" id="Cantidad" name="Cantidad" required>
        </a>
        <p>
            <button type="submit">Enviar pedido</button>
        </p>
    </form>
</body>
</html>
