<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>01 · El script que llega antes de tiempo</title>
  <link rel="stylesheet" href="estilo-ejemplos.css">

  <!-- En el <head> y SIN defer: se ejecuta antes de que el navegador
       haya leído el <body>, así que el <h1> todavía no existe. -->
  <script src="titulo.js"></script>
</head>
<body>
  <h1 id="titulo">Título original</h1>

  <div class="aviso">
    <p>Abre la consola: clic derecho en la página → <strong>Inspeccionar</strong> → pestaña
       <strong>Console</strong>. <em>(Atajo: <code>F12</code> en Windows y Linux,
       <code>Cmd + Option + J</code> en Mac.)</em></p>
    <p>El selector está bien escrito y el <code>h1</code> existe… pero mira qué ha encontrado.</p>
  </div>
</body>
</html>
