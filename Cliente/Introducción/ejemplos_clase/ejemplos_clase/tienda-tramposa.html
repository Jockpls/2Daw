<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Gran Capitán</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      font-size: 1.25rem;
      line-height: 1.6;
    }
    h1 { border-bottom: 3px solid #333; padding-bottom: .3rem; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      padding: .6rem 0;
      border-bottom: 1px solid #ddd;
    }
    #total {
      font-size: 2rem;
      font-weight: bold;
      text-align: right;
      margin: 1.5rem 0;
      color: #b30000;
    }
    form { display: flex; gap: .8rem; align-items: center; }
    input { padding: .5rem; font-size: 1rem; flex: 1; }
    button {
      padding: .6rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      background: #333;
      color: white;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Tienda Gran Capitán</h1>

  <ul id="catalogo">
    <li data-precio="899.00"><span>Portátil</span> <span>899,00 €</span></li>
    <li data-precio="249.00"><span>Monitor</span>  <span>249,00 €</span></li>
    <li data-precio="99.00"><span>Teclado</span>   <span>99,00 €</span></li>
  </ul>

  <p id="total"></p>

  <form id="pedido">
    <input type="email" id="email" placeholder="Tu email" required>
    <button type="submit">Comprar</button>
  </form>

  <script>
    function calcularTotal() {
      const items = document.querySelectorAll('#catalogo li');
      let suma = 0;
      for (const item of items) {
        suma += Number(item.dataset.precio);
      }
      return suma;
    }

    function pintarTotal() {
      const total = calcularTotal();
      document.getElementById('total').textContent =
        'Total: ' + total.toFixed(2).replace('.', ',') + ' €';
    }

    pintarTotal();

    document.getElementById('pedido').addEventListener('submit', function (e) {
      e.preventDefault();
      const total = calcularTotal();
      alert('Pedido confirmado por ' + total.toFixed(2).replace('.', ',') + ' €');
    });
  </script>

</body>
</html>
